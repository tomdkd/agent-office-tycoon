services:
  app:
    build:
      context: .
      target: production
      args:
        VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
